<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chart from SQL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="errorBox" style="display:none; color: red; margin-top: 10px;"></div>
    <select id="chartType">
        <option value="bar">Bar</option>
        <option value="line">Line</option>
        <option value="pie">Pie</option>
        <option value="doughnut">Doughnut</option>
        <option value="scatter">Scatter</option>
    </select>
    <select id="xAxisSelector"></select>
    <select id="yAxisSelector"></select>
    <input id="question" placeholder="Ask a data question">
    <button onclick="fetchData()">Generate Chart</button>
    <button onclick="renderWithSelectedType()">Render Chart</button>
    <div id="loader" style="display:none; margin: 10px;">
        <div class="spinner" style="
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        "></div>
        <span>Loading...</span>
    </div>

    <canvas id="myChart" width="800" height="400"></canvas>

    <script>
        let currentChart = null;
        let chartData = null;  // cache fetched data
        const errorBox = document.getElementById("errorBox");
        const loader = document.getElementById("loader");

        errorBox.textContent = "";
        errorBox.style.display = "none";


        function renderChart(chartType, data) {
            const ctx = document.getElementById("myChart").getContext("2d");

            if (currentChart) {
                currentChart.destroy();
            }

            currentChart = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: data.labels,
                    datasets: data.datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: `Chart: ${chartType}` }
                    }
                }
            });
        }

        async function fetchData() {
            const question = document.getElementById("question").value;
            loader.style.display = "block";

        try{
            const response = await fetch("http://localhost:8000/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }

            // if (chartData.error) {
            //     alert(chartData.error);
            //     return;
            // }

            // const result = await response.json();

            // if (!result || !result.columns || !result.rows) {
            //     throw new Error("Malformed response data.");
            // }
            chartData = await response.json(); // Store in global variable
            console.log(chartData)
            populateAxisSelectors(chartData.columns);
            renderWithSelectedType(); // Immediately render with selected type
            }
            catch(err){        
                console.error("Fetch failed:", err);
                 errorBox.textContent = "⚠️ Something went wrong. Please try rephrasing your question or retry in a moment.";
                 errorBox.style.display = "block";
            } finally {
                loader.style.display = "none";
            }
        }

        function renderWithSelectedType() {
            if (!chartData) {
                alert("Please fetch data first.");
                return;
            }

            const chartType = document.getElementById("chartType").value;
            const xKey = document.getElementById("xAxisSelector").value;
            const yKey = document.getElementById("yAxisSelector").value;

            const preparedData = prepareChartData(chartData, xKey, yKey);
            renderChart(chartType, preparedData);
        }


        function prepareChartData({ rows, columns }, xKey, yKey) {
        return {
            labels: rows.map(row => formatLabel(row[xKey])), // ось X
            datasets: [
            {
                label: yKey,
                data: rows.map(row => row[yKey]), // ось Y
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1,
            }
            ]
        };
        }

        // Вспомогательная функция форматирования
        function formatLabel(val) {
        if (val instanceof Date) {
            return val.toISOString().slice(0, 10); // 'YYYY-MM-DD'
        }
        if (typeof val === 'string' && val.includes('T')) {
            return new Date(val).toISOString().slice(0, 10);
        }
        return val;
        }

        
        function populateAxisSelectors(columns) {
            const xSelect = document.getElementById("xAxisSelector");
            const ySelect = document.getElementById("yAxisSelector");

            // Clear previous options
            xSelect.innerHTML = '';
            ySelect.innerHTML = '';

            for (const col of columns) {
                const xOpt = document.createElement("option");
                xOpt.value = xOpt.text = col;
                xSelect.appendChild(xOpt);

                const yOpt = document.createElement("option");
                yOpt.value = yOpt.text = col;
                ySelect.appendChild(yOpt);
            }

            // Optional: set defaults
            xSelect.selectedIndex = 1;
            ySelect.selectedIndex = 0;
        }
    </script>
    <style>
        @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
