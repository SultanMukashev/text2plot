<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chart from SQL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <select id="chartType">
        <option value="bar">Bar</option>
        <option value="line">Line</option>
        <option value="pie">Pie</option>
        <option value="doughnut">Doughnut</option>
        <option value="scatter">Scatter</option>
    </select>
    <input id="question" placeholder="Ask a data question">
    <button onclick="fetchData()">Generate Chart</button>
    <button onclick="renderWithSelectedType()">Render Chart</button>
    <canvas id="myChart" width="800" height="400"></canvas>

    <script>
        let currentChart = null;
        let chartData = null;  // cache fetched data

        function renderChart(chartType, data) {
            const ctx = document.getElementById("myChart").getContext("2d");

            if (currentChart) {
                currentChart.destroy();
            }

            currentChart = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: data.labels,
                    datasets: data.datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: `Chart: ${chartType}` }
                    }
                }
            });
        }

        async function fetchData() {
            const question = document.getElementById("question").value;
            const response = await fetch("http://localhost:8000/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            chartData = await response.json(); // Store in global variable
            renderWithSelectedType(); // Immediately render with selected type
        }

        function renderWithSelectedType() {
            if (!chartData) {
                alert("Please fetch data first.");
                return;
            }

            const chartType = document.getElementById("chartType").value;
            renderChart(chartType, chartData);
        }

    </script>
</body>
</html>
